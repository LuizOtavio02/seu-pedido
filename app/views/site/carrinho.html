{% extends 'layout.html' %}

{% block site_content %}

<div class="d-flex" id="wrapper">
    <div class="border-end" id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom bg-dark">Meu Projeto</div>
        <div class="list-group list-group-flush">
            <a href="/" class="nav-link-custom border-bottom border-secondary">Home</a>
            <a href="/produtos" class="nav-link-custom border-bottom border-secondary">Produtos</a>
            <a href="/cliente" class="nav-link-custom border-bottom border-secondary">Cliente</a>
            <a href="/carrinho" class="nav-link-custom border-bottom border-secondary">Carrinho</a>
            <a href="/admin" class="nav-link-custom">Admin</a>
        </div>
    </div>

    <div id="page-content-wrapper" class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
            <div class="container-fluid">
                <button class="btn btn-primary" id="menu-toggle">☰ Menu</button>
                <span id="nome" class="ms-2"></span>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="container">
                <h1>Carrinho</h1>
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Preço</th>
                            <th scope="col">Quantidade</th>
                            <th scope="col">Valor Total</th>
                            <th scope="col">Remover Produto</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">

                    </tbody>
                    <tfoot id="tfoot">

                    </tfoot>
                </table>
                <div class="card shadow-sm mb-4">

                    <div class="card-header">
                        <h4 class="mb-0">Cliente</h4>
                    </div>

                    <div class="card-body">
                        <form id="form-busca-cliente" action="" method="GET">
                            <div class="input-group">
                                <input type="search" name="b" class="form-control"
                                    placeholder="Digite o nome do Cliente">
                                <button class="btn btn-dark">Buscar</button>
                            </div>
                            <div id="message"></div>
                        </form>
                    </div>

                </div>

                <!-- RESULTADOS -->
                <div id="resultadoBusca">
                </div>
                <div>
                    <button class="finalizar-compra btn btn-primary btn-lg">
                        Finalizar Compra
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block css %}
<link rel="stylesheet" href="/assets/css/style.css">
{% endblock %}

{% block scripts %}
<script src="/assets/js/carrinho.js"></script>
{% endblock %}
