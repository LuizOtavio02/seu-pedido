{% extends 'layout.html' %}

{% block site_content %}
<div class="d-flex" id="wrapper">
    <div class="border-end" id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom bg-dark">Meu Projeto</div>
        <div class="list-group list-group-flush">
            <a href="/admin" class="nav-link-custom border-bottom border-secondary">Home</a>
            <a href="/admin/produtos" class="nav-link-custom border-bottom border-secondary">Produtos</a>
            <a href="/admin/cliente" class="nav-link-custom border-bottom border-secondary">Cliente</a>
            <a href="/admin/equipe" class="nav-link-custom border-bottom border-secondary">Equipe</a>
            <a href="/" class="nav-link-custom">Funcionario</a>
        </div>
    </div>

    <div id="page-content-wrapper" class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
            <div class="container-fluid">
                <button class="btn btn-primary" id="menu-toggle">☰ Menu</button>
                <span id="nome" class="ms-2"></span>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="container py-4">
                <div class="row g-4">

                    <!-- Adicionar Produto -->
                    <div class="col-lg-5">
                        <div class="card shadow-sm">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0">Cadastrar Produto</h5>
                            </div>

                            <div class="card-body">
                                <form id="formAdicionarProduto">

                                    <div class="mb-3">
                                        <label class="form-label">Nome do Produto</label>
                                        <input id="produto" type="text" class="form-control" name="nome">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Preço</label>
                                        <input id="preco" type="number" step="0.01" class="form-control" name="preco">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Slug</label>
                                        <input id="slug" type="text" class="form-control" name="slug">
                                        <div class="form-text">
                                            Ex: detergente-neutro-500ml
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Estoque</label>
                                        <input id="estoque" type="number" class="form-control" name="estoque">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Categoria</label>
                                        <select id="categoriaId" class="form-select" name="categoria_id">
                                            <option value="">Selecione...</option>
                                            <option value="1">Limpeza</option>
                                            <option value="2">Higiene</option>
                                            <option value="3">Utilidades</option>
                                        </select>
                                    </div>

                                    <button id="salvar-produto" type="submit" class="btn btn-primary w-100">
                                        Salvar Produto
                                    </button>

                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Pesquisar e Editar -->
                    <div class="col-lg-7">
                        <div class="card shadow-sm">
                            <div class="card-header bg-secondary text-white">
                                <h5 class="mb-0">Pesquisar e Editar Produto</h5>
                            </div>

                            <div class="card-body">

                                <!-- Pesquisa -->
                                <div class="card shadow-sm mb-4">

                                    <div class="card-body">
                                        <form id="form-busca" action="" method="GET">
                                            <div class="input-group">
                                                <input type="text" name="pesquisaProduto" class="form-control"
                                                    placeholder="Digite o nome do Produto" id="pesquisaProduto"
                                                    onkeyup="carregarProdutos(this.value)">

                                                <button type="submit" class="btn btn-dark">Buscar</button>
                                            </div>
                                            <span id="resultadoPesquisa"></span>
                                            <div id="message"></div>
                                        </form>
                                    </div>

                                </div>

                                <!-- RESULTADOS -->
                                <div id="resultadoBusca">

                                </div>

                                <!-- Modal fica FORA -->
                                <div class="modal fade" id="modalEditar" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">

                                            <div class="modal-header">
                                                <h5 class="modal-title">Editar Funcionário</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal">
                                                </button>
                                            </div>

                                            <div class="modal-body">

                                                <input type="hidden" id="editar-id">

                                                <div class="mb-3">
                                                    <label class="form-label">Nome</label>
                                                    <input type="text" class="form-control" id="editar-nome">
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Preço</label>
                                                    <input type="text" class="form-control" id="editar-preco">
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Slug</label>
                                                    <input type="text" class="form-control" id="editar-slug">
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Estoque</label>
                                                    <input type="text" class="form-control" id="editar-estoque">
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Categoria</label>
                                                    <select id="editar-categoriaId" class="form-select">
                                                        <option value="">Selecione...</option>
                                                        <option value="1">Limpeza</option>
                                                        <option value="2">Higiene</option>
                                                        <option value="3">Utilidades</option>
                                                    </select>
                                                </div>

                                            </div>

                                            <div class="modal-footer">
                                                <button class="btn btn-secondary" data-bs-dismiss="modal">
                                                    Cancelar
                                                </button>

                                                <button class="btn btn-dark" id="salvar-edicao">
                                                    Salvar
                                                </button>
                                            </div>

                                        </div>
                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block css %}
<link rel="stylesheet" href="/assets/css/style.css">
{% endblock %}

{% block scripts %}
<script src="/assets/js/carrinhoApi.js"></script>
<script src="/assets/js/produtos.js"></script>
{% endblock %}
